name: Replace repository from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and validate replacement ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Files in repository root:"
          find . -maxdepth 2 -type f -not -path './.git/*' -printf '%p\n' | sort

          # Find a ZIP anywhere in the checked-out repository, ignoring the workflow itself.
          mapfile -t ZIP_FILES < <(
            find . -type f \( -iname '*.zip' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No .zip file was found in the repository checkout. Make sure the uploaded ZIP is committed to the main branch, not just selected in the GitHub upload screen."
            exit 1
          fi

          echo "ZIP files found:"
          printf ' - %s\n' "${ZIP_FILES[@]}"

          # Prefer the expected filename; otherwise use the newest/first ZIP found.
          ZIP_PATH=""
          for candidate in "${ZIP_FILES[@]}"; do
            if [[ "$(basename "$candidate" | tr '[:upper:]' '[:lower:]')" == "macrowan_final_repository.zip" ]]; then
              ZIP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$ZIP_PATH" ]; then
            if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
              echo "::error::More than one ZIP was found and none is named Macrowan_Final_Repository.zip. Rename the intended archive to Macrowan_Final_Repository.zip, commit it, and run again."
              exit 1
            fi
            ZIP_PATH="${ZIP_FILES[0]}"
          fi

          echo "Using archive: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          mkdir -p /tmp/macrowan-replacement
          unzip -q "$ZIP_PATH" -d /tmp/macrowan-replacement

          # Locate package.json and use its parent directory as the project root.
          PACKAGE_JSON="$(find /tmp/macrowan-replacement -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::No package.json found in the ZIP. Upload the complete React/Vite repository ZIP."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PACKAGE_JSON")"
          if [ ! -f "$PROJECT_ROOT/index.html" ]; then
            echo "::error::The detected project root does not contain index.html. The ZIP may not contain the complete Vite app."
            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Replace repository files
        shell: bash
        run: |
          set -euo pipefail

          # Preserve Git metadata and workflow files, replace the app from the ZIP.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT_ROOT/" "$GITHUB_WORKSPACE/"

          # Do not keep the uploaded archive in the live project repository.
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -delete

      - name: Commit and push replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi
          git commit -m "Replace repository with complete Macrowan website"
          git push
