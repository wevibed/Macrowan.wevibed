name: Replace Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract new project
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "Extracted:"
          find extracted -maxdepth 2 -type f | head -100

      - name: Locate Macrowan project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 2 -type f -name "package.json" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find package.json in extracted project."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Replace existing repository
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Replacing current repository..."

          # Remove everything except Git metadata,
          # extracted folder and ZIP temporarily.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "extracted" \
            -exec rm -rf {} +

          # Copy the NEW project into the repository root.
          cp -a "$PROJECT_DIR"/. .

          # Remove temporary extraction files.
          rm -rf extracted

      - name: Show new project
        shell: bash
        run: |
          echo "===== NEW PROJECT ====="
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -150

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace Macrowan website with updated version"
          git push
