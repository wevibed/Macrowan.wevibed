name: Replace Macrowan Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "Macrowan-black-blue.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "Macrowan-black-blue.zip not found"
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          rm -rf /tmp/macrowan-new
          mkdir -p /tmp/macrowan-new

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/macrowan-new

          echo "Extracted structure:"
          find /tmp/macrowan-new -maxdepth 3 -type f | sort

      - name: Find new project
        id: project
        run: |
          PROJECT=$(find /tmp/macrowan-new -type f -name package.json -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Could not find package.json"
            exit 1
          fi

          echo "New project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Remove old website
        run: |
          echo "Removing old project files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "Macrowan-black-blue.zip" \
            -exec rm -rf {} +

      - name: Copy new website
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          echo "Copying new project from:"
          echo "$PROJECT"

          cp -a "$PROJECT"/. .

      - name: Remove ZIP
        run: |
          rm -f Macrowan-black-blue.zip

      - name: Verify replacement
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== PACKAGE ====="
          cat package.json

          echo "===== SOURCE ====="
          find src -maxdepth 2 -type f | sort

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          git commit -m "Replace Macrowan website with black and blue version"

          git push
